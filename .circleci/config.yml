version: 2.1

functions:
  dotnet: github.com/circleci-functions/setup-dotnet@v0.1.0

jobs:
  build-and-test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - dotnet:
          with:
            dotnet-version: 8.0.x
      - dotnet/restore
      - run:
          name: Build
          command: dotnet build --configuration Release --no-restore
      - run:
          name: Test
          command: circleci testsuite run "unit tests"

workflows:
  main:
    jobs:
      - build-and-test
